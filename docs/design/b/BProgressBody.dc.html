<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
renderVals() {
const X = (d) => +(30 + d / 83 * 286).toFixed(1);
const Y = (w) => +(10 + (82 - w) / 10 * 170).toFixed(1);
const trend = (t) => 81 - 3.8 * Math.pow(t / 65, 0.92);
let dots = ''; const pts = [];
for (let t = 0; t <= 65; t++) {
const w = trend(t) + 0.38 * Math.sin(t * 1.7) + 0.22 * Math.sin(t * 0.6 + 1);
if (t % 6 !== 3) dots += 'M' + X(t) + ' ' + Y(w) + ' h0.01 ';
if (t % 2 === 0 || t === 65) pts.push(X(t) + ' ' + Y(trend(t)));
}
const avg = 'M' + pts.join(' L');
const lx = X(65), ly = Y(77.2);
const fc = 'M' + lx + ' ' + ly + ' L' + X(83) + ' ' + Y(75.75);
const dia = (d, w) => { const cx = X(d), cy = Y(w); return 'M' + cx + ' ' + (cy - 6) + ' L' + (cx + 6) + ' ' + cy + ' L' + cx + ' ' + (cy + 6) + ' L' + (cx - 6) + ' ' + cy + ' Z '; };
return { dots, avg, fc, cpDone: dia(27, 78.5) + dia(55, 77), cpOpen: dia(83, 75.5), last: { x: lx, y: ly } };
}
}
</script>
