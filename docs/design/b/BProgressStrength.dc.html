<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>B — Прогресс · Сила</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.b{--bg:#F2F0EB;--card:#FFFFFF;--ink:#111214;--muted:#66635C;--line:#ECEAE4;--lime:#D4F25A;font-family:'Manrope',system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);-webkit-font-smoothing:antialiased}
.b a{color:inherit;text-decoration:none}
.u{font-family:'Unbounded',sans-serif;letter-spacing:-0.02em}
.tab{height:42px;border-radius:21px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;min-height:70px;padding:0 18px;border-top:1px solid var(--line)}
</style>
</helmet>
<div class="b" style="position: relative; width: 390px; height: 844px; background: var(--bg); overflow: hidden">
<div style="padding: 60px 16px 40px; display: flex; flex-direction: column; gap: 12px">
<h1 class="u" style="margin: 0 6px 4px; font-size: 28px; font-weight: 700">Прогресс</h1>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; background: var(--card); border-radius: 25px; padding: 4px">
<a href="BProgressBody.dc.html" class="tab">Тело</a>
<a href="BProgressStrength.dc.html" class="tab" style="background: var(--ink); color: var(--lime)" aria-current="page">Сила</a>
<a href="BNutrition.dc.html" class="tab">Питание</a>
<a href="BDiscipline.dc.html" class="tab">Режим</a>
</div>

<section style="background: var(--lime); border-radius: 30px; padding: 20px; display: flex; align-items: center; gap: 16px">
<span class="u" style="font-size: 52px; line-height: 56px; font-weight: 700">11</span>
<span style="display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 800">рекордов с 9 ноября</span><span style="font-size: 14px; font-weight: 600; color: #3E4A12">сила растёт на дефиците — так и надо</span></span>
</section>

<section style="background: var(--card); border-radius: 28px; overflow: hidden">
<div style="display: flex; justify-content: space-between; padding: 14px 18px 8px; font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--muted)"><span>УПРАЖНЕНИЕ</span><span>E1RM · С НАЧАЛА</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div class="row">
<span style="flex: 1; display: flex; flex-direction: column; min-width: 0"><span style="font-size: 15px; font-weight: 800">{{r.name}}</span><span style="font-size: 13px; color: var(--muted)">{{r.last}}</span></span>
<svg width="64" height="30" viewBox="0 0 72 30" aria-hidden="true"><path d="{{r.d}}" fill="none" stroke="#111214" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span style="width: 62px; display: flex; flex-direction: column; align-items: flex-end"><span class="u" style="font-size: 15px; font-weight: 700">{{r.e}}</span><span style="font-size: 12px; font-weight: 800; background: var(--lime); padding: 1px 6px; border-radius: 999px">{{r.delta}}</span></span>
</div>
</sc-for>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const spark = (v) => { const lo = Math.min(...v), hi = Math.max(...v); return 'M' + v.map((x, i) => (2 + i * 68 / (v.length - 1)).toFixed(1) + ' ' + (27 - (x - lo) / (hi - lo) * 24).toFixed(1)).join(' L'); };
const rows = [
{ name: 'Румынская тяга', last: '70 × 10 · сегодня', v: [72, 75, 78, 80, 83, 86.7, 93.3], e: '93,3', delta: '+21,3' },
{ name: 'Присед со штангой', last: '55 × 10 · 11 янв', v: [60, 64, 68, 70, 73.3], e: '73,3', delta: '+13,3' },
{ name: 'Жим лёжа', last: '50 × 8 · 11 янв', v: [53, 55, 57, 58, 60, 62, 63.3], e: '63,3', delta: '+10,3' },
{ name: 'Тяга верхнего блока', last: '50 × 10 · 6 янв', v: [53, 56, 60, 63, 66.7], e: '66,7', delta: '+13,7' },
{ name: 'Тяга гантели', last: '22 × 12 · 11 янв', v: [24, 25.6, 26.7, 28, 29.3, 30.8], e: '30,8', delta: '+6,8' },
{ name: 'Жим гантелей сидя', last: '18 × 12 · сегодня', v: [19, 20, 21, 22.4, 22.4, 25.2], e: '25,2', delta: '+6,2' }
].map((r) => ({ ...r, d: spark(r.v) }));
return { rows };
}
}
</script>
</body>
</html>
