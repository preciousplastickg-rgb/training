<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>B — Первый запуск</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.b{--bg:#F2F0EB;--card:#FFFFFF;--ink:#111214;--muted:#66635C;--lime:#D4F25A;--track:#ECEAE4;font-family:'Manrope',system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);-webkit-font-smoothing:antialiased}
.b button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.u{font-family:'Unbounded',sans-serif;letter-spacing:-0.02em}
.st{width:48px;height:48px;border-radius:24px;background:var(--track);display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div class="b" style="position: relative; width: 390px; height: 844px; background: var(--bg); overflow: hidden; display: flex; flex-direction: column">
<div style="padding: 58px 22px 0; display: flex; align-items: center; justify-content: space-between">
<button aria-label="Назад" style="width: 48px; height: 48px; border-radius: 24px; background: var(--card); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
<div style="display: flex; gap: 6px" aria-label="Шаг 3 из 4"><span style="width: 22px; height: 8px; border-radius: 4px; background: var(--ink)"></span><span style="width: 22px; height: 8px; border-radius: 4px; background: var(--ink)"></span><span style="width: 40px; height: 8px; border-radius: 4px; background: var(--ink)"></span><span style="width: 22px; height: 8px; border-radius: 4px; background: #D6D2C9"></span></div>
</div>

<div style="padding: 34px 22px 0; display: flex; flex-direction: column; gap: 10px">
<h1 class="u" style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 700">Какой обхват талии?</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--muted)">Утром, на выдохе, лента на уровне пупка.</p>
</div>

<div style="display: flex; align-items: baseline; justify-content: center; gap: 8px; margin-top: 26px"><span class="u" style="font-size: 76px; line-height: 84px; font-weight: 700">98</span><span style="font-size: 20px; font-weight: 700; color: var(--muted)">см</span></div>
<div aria-hidden="true" style="position: relative; height: 64px; margin: 8px 0 0; overflow: hidden">
<div style="position: absolute; left: 50%; top: 0; width: 4px; height: 44px; margin-left: -2px; border-radius: 2px; background: var(--ink); z-index: 1"></div>
<div style="position: absolute; left: 34px; top: 4px; display: flex; gap: 8px; align-items: flex-start">
<sc-for list="{{ticks}}" as="t" hint-placeholder-count="41"><span style="position: relative; width: 2px; height: {{t.h}}; border-radius: 1px; background: {{t.c}}"><span style="position: absolute; top: 38px; left: -10px; width: 22px; text-align: center; font-size: 11px; font-weight: 700; color: #8A867E">{{t.l}}</span></span></sc-for>
</div>
</div>

<div style="margin: 14px 16px 0; background: var(--card); border-radius: 24px; padding: 12px 12px 12px 20px; display: flex; align-items: center; gap: 10px">
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 13px; color: var(--muted)">Шея, под кадыком</span><span class="u" style="font-size: 24px; font-weight: 700">39 <span style="font-family: Manrope, sans-serif; font-size: 14px; font-weight: 700; color: var(--muted)">см</span></span></span>
<button class="st" aria-label="Шея минус 1 см"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
<button class="st" aria-label="Шея плюс 1 см"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<div style="margin: 12px 16px 0; background: var(--ink); color: #fff; border-radius: 26px; padding: 18px 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #A7A9AE">Жир сейчас</span><span class="u" style="font-size: 30px; font-weight: 700; color: var(--lime)">24,5%</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #A7A9AE">Цель при 15%</span><span class="u" style="font-size: 30px; font-weight: 700">≈ 72 кг</span></div>
<div style="grid-column: span 2; font-size: 12px; line-height: 17px; color: #A7A9AE">Ориентир: мышцы 61,2 кг ÷ 0,85. Уточним 31 января по новым замерам.</div>
</div>

<div style="margin-top: auto; padding: 0 16px 40px"><button style="width: 100%; height: 60px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 17px; font-weight: 800">Дальше</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const ticks = [];
for (let v = 82; v <= 114; v++) {
const major = v % 5 === 0;
const near = Math.abs(v - 98) <= 0;
ticks.push({ h: major ? '30px' : '18px', c: near ? '#111214' : major ? '#8A867E' : '#C9C5BC', l: major ? String(v) : '' });
}
return { ticks };
}
}
</script>
</body>
</html>
